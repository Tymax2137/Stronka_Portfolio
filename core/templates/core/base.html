<!DOCTYPE html>
<html lang="pl" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio | Cybersecurity & Engineering{% endblock %}</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css](https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css)" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="[https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css](https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css)">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .font-mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        .navbar {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
        }
        .card-tech {
            background-color: #161b22;
            border: 1px solid #30363d;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        .card-tech:hover {
            border-color: #58a6ff;
            transform: translateY(-2px);
        }
        .markdown-body pre {
            background-color: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 1rem;
            color: #e6edf3;
            overflow-x: auto;
        }
        .markdown-body code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #79c0ff;
        }
        .markdown-body pre code {
            color: inherit;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Nawigacja -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand font-mono fw-bold text-light" href="{% url 'home' %}">
                <span class="text-primary">~/</span>portfolio
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto font-mono">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">01. O_mnie</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'project_list' %}">02. Projekty</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}#kontakt">03. Kontakt</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Główna treść podstrony -->
    <main class="container my-5 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Stopka -->
    <footer class="py-4 mt-auto border-top border-secondary-subtle text-center text-muted small font-mono">
        <div class="container">
            <span>Hostowane na własnej infrastrukturze // Powered by Django & Bootstrap 5</span>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS -->
    <script src="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js](https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js)"></script>
</body>
</html>
